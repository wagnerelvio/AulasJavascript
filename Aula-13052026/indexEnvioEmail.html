<!--"SUA_PUBLIC_KEY"-->
<!-- "SEU_SERVICE_ID"   -->
<!-- "SEU_TEMPLATE_ID" -->
<!-- https://www.emailjs.com/ -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Envio de Nome e Idade por E-mail</title>
</head>
<body>

    <h2>Formulário de Cadastro</h2>

    <form id="formulario">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Digite sua idade">

        <br><br>

        <button type="submit">Enviar dados</button>

    </form>

    <p id="mensagem"></p>

    <!-- Biblioteca do EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        const formulario = document.getElementById("formulario");
        const campoNome = document.getElementById("nome");
        const campoIdade = document.getElementById("idade");
        const mensagem = document.getElementById("mensagem");

        emailjs.init({
            publicKey: "SUA_PUBLIC_KEY"
        });

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = campoNome.value.trim();
            const idade = campoIdade.value.trim();

            if (nome === "") {
                mensagem.textContent = "Digite o nome.";
                mensagem.style.color = "red";
                return;
            }

            if (idade === "") {
                mensagem.textContent = "Digite a idade.";
                mensagem.style.color = "red";
                return;
            }

            const dadosEmail = {
                nome_usuario: nome,
                idade_usuario: idade
            };

            emailjs.send("SEU_SERVICE_ID", "SEU_TEMPLATE_ID", dadosEmail)
                .then(function() {
                    mensagem.textContent = "Dados enviados com sucesso.";
                    mensagem.style.color = "green";

                    campoNome.value = "";
                    campoIdade.value = "";
                })
                .catch(function(error) {
                    mensagem.textContent = "Erro ao enviar os dados. Verifique a configuração do EmailJS.";
                    mensagem.style.color = "red";

                    console.log("Erro:", error);
                });
        });
    </script>

</body>
</html>
