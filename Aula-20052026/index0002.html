<!DOCTYPE html>
<html lang="pt-br" ng-app="appCalculadora">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Simples</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            padding: 30px;
        }

        .container {
            width: 430px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.18);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #bbb;
            box-sizing: border-box;
        }

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            padding: 10px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163957;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-left: 5px solid #2e7d32;
            border-radius: 6px;
            font-weight: bold;
        }

        .erro {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebee;
            border-left: 5px solid #c62828;
            border-radius: 6px;
        }
    </style>
</head>

<body ng-controller="CalculadoraController">

    <div class="container">
        <h1>Calculadora Simples</h1>

        <label>Primeiro número:</label>
        <input type="number" ng-model="numero1" placeholder="Digite o primeiro número">

        <label>Segundo número:</label>
        <input type="number" ng-model="numero2" placeholder="Digite o segundo número">

        <div class="botoes">
            <button ng-click="calcular('+')">Somar</button>
            <button ng-click="calcular('-')">Subtrair</button>
            <button ng-click="calcular('*')">Multiplicar</button>
            <button ng-click="calcular('/')">Dividir</button>
        </div>

        <div class="resultado" ng-if="resultado !== null">
            Resultado: {{ resultado }}
        </div>

        <div class="erro" ng-if="erro">
            {{ erro }}
        </div>
    </div>

    <script>
        var app = angular.module("appCalculadora", []);

        app.controller("CalculadoraController", function($scope) {

            $scope.numero1 = null;
            $scope.numero2 = null;
            $scope.resultado = null;
            $scope.erro = "";

            $scope.calcular = function(operacao) {

                $scope.erro = "";
                $scope.resultado = null;

                if ($scope.numero1 === null || $scope.numero2 === null) {
                    $scope.erro = "Digite os dois números.";
                    return;
                }

                if (operacao === "+") {
                    $scope.resultado = $scope.numero1 + $scope.numero2;
                }

                if (operacao === "-") {
                    $scope.resultado = $scope.numero1 - $scope.numero2;
                }

                if (operacao === "*") {
                    $scope.resultado = $scope.numero1 * $scope.numero2;
                }

                if (operacao === "/") {
                    if ($scope.numero2 === 0) {
                        $scope.erro = "Não é possível dividir por zero.";
                        return;
                    }

                    $scope.resultado = $scope.numero1 / $scope.numero2;
                }
            };
        });
    </script>

</body>
</html>
