<!DOCTYPE html>
<html lang="pt-br" ng-app="appCadastro">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef3f8;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.18);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163957;
        }

        .mensagem {
            margin-top: 15px;
            padding: 12px;
            background-color: #e8f5e9;
            border-left: 5px solid #2e7d32;
            border-radius: 6px;
        }

        li {
            margin-bottom: 6px;
        }
    </style>
</head>

<body ng-controller="CadastroController">

    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <label>Nome:</label>
        <input type="text" ng-model="aluno.nome" placeholder="Digite o nome">

        <label>Idade:</label>
        <input type="number" ng-model="aluno.idade" placeholder="Digite a idade">

        <label>Curso:</label>
        <input type="text" ng-model="aluno.curso" placeholder="Digite o curso">

        <button ng-click="cadastrarAluno()">Cadastrar</button>

        <div class="mensagem" ng-if="mensagem">
            {{ mensagem }}
        </div>

        <h3>Alunos cadastrados</h3>

        <ul>
            <li ng-repeat="item in alunos">
                {{ item.nome }} - {{ item.idade }} anos - {{ item.curso }}
            </li>
        </ul>
    </div>

    <script>
        var app = angular.module("appCadastro", []);

        app.controller("CadastroController", function($scope) {

            $scope.aluno = {
                nome: "",
                idade: "",
                curso: ""
            };

            $scope.alunos = [];

            $scope.mensagem = "";

            $scope.cadastrarAluno = function() {

                if (!$scope.aluno.nome || !$scope.aluno.idade || !$scope.aluno.curso) {
                    $scope.mensagem = "Preencha todos os campos.";
                    return;
                }

                $scope.alunos.push({
                    nome: $scope.aluno.nome,
                    idade: $scope.aluno.idade,
                    curso: $scope.aluno.curso
                });

                $scope.mensagem = "Aluno cadastrado com sucesso.";

                $scope.aluno = {
                    nome: "",
                    idade: "",
                    curso: ""
                };
            };
        });
    </script>

</body>
</html>
