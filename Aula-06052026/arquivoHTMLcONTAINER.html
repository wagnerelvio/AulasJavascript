<body>

    <div class="container">

        <h1>Formulário de Contato</h1>

        <p>
            Preencha os campos abaixo para simular a validação dos dados usando JavaScript.
        </p>

        <form>
            <h3 id="msgValidacao"></h3>

            <label for="nome">Nome *</label>
            <input type="text" id="nome">

            <label for="idade">Idade *</label>
            <input type="number" id="idade">

            <button type="button" onclick="validarDados()">Validar dados</button>
        </form>

    </div>

</body>
